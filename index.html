<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voxel Quantum OS : Universal Edition</title>
    <style>
        :root { --bg: #010203; --cyan: #00f3ff; --gold: #f39c12; --green: #00ff66; --red: #ff3366; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--white); touch-action: none; }
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* IN-APP BROWSER ESCAPE */
        #in-app-escape { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; backdrop-filter: blur(20px); }
        .escape-box { background: rgba(243,156,18,0.1); border: 1px solid var(--gold); padding: 20px; border-radius: 20px; }

        /* QUANTUM BODHI GATE (Graph-rendered UI) */
        #welcome-gate { display: none; position: fixed; inset: 0; background: radial-gradient(circle, rgba(0,20,30,0.9) 0%, rgba(0,0,0,0.98) 100%); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; padding: 25px; text-align: center; backdrop-filter: blur(30px); }
        .gate-box { background: rgba(0, 10, 15, 0.6); border: 1px solid rgba(0, 243, 255, 0.25); padding: 40px 25px; border-radius: 20px; max-width: 380px; box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); }
        .cyber-title { color: var(--cyan); font-size: 0.85rem; margin-bottom: 15px; font-family: monospace; letter-spacing: 1px; }

        /* HUD & UI LAYER */
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px; }
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; margin-top: 10px; }
        .glass-pill { background: rgba(0,0,0,0.6); border: 1px solid rgba(0,243,255,0.2); padding: 6px 12px; border-radius: 20px; font-size: 0.65rem; color: var(--cyan); font-family: monospace; backdrop-filter: blur(10px); }
        
        .hud-panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 16px; backdrop-filter: blur(15px); pointer-events: auto; width: 100%; max-width: 420px; margin: 0 auto; }
        .btn-glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--white); padding: 14px; border-radius: 16px; font-size: 0.85rem; font-weight: bold; cursor: pointer; width: 100%; transition: transform 0.2s; }
        .btn-glass:active { transform: scale(0.95); }

        /* CONTACT DRAWER */
        #contact-drawer { position: absolute; bottom: -100%; left: 0; width: 100%; background: rgba(1,2,3,0.95); border-top: 1px solid var(--green); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)) 20px; z-index: 40; backdrop-filter: blur(20px); transition: bottom 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); pointer-events: auto; }
        #contact-drawer.open { bottom: 0; }
        .drawer-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin: 0 auto 15px auto; cursor: pointer; }
        .contact-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px 15px; border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .btn-call { background: rgba(0, 255, 102, 0.15); border: 1px solid var(--green); color: var(--green); padding: 6px 12px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        video { display: none; }
    </style>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.150.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/" } }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div id="in-app-escape">
        <div class="escape-box">
            <h2 style="color:var(--gold); margin-bottom:10px;">🪷 กรงขังมายา (In-App Browser)</h2>
            <p style="font-size:0.8rem; color:#ccc; line-height:1.5;">โปรดแตะจุด 3 จุด (•••) มุมขวาบน<br>แล้วเลือก <b>"เปิดใน Safari / Chrome"</b><br>เพื่อเข้าสู่มิติควอนตัมอย่างสมบูรณ์</p>
        </div>
    </div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="glass-pill" id="my-spore-id">ศาลาพักใจ: กำลังเชื่อมต่อ...</div>
            <div class="glass-pill" id="eco-status" style="color:var(--gold); border-color:var(--gold);">ฌานสมาบัติ</div>
        </div>
        <div class="hud-panel" id="main-controls">
            <button class="btn-glass" style="border-color:var(--cyan); color:var(--cyan);" onclick="toggleContactDrawer()">🍄 โครงข่ายไมโครไรซา (ดึงจิตเพื่อน)</button>
        </div>
        <div class="hud-panel" id="call-controls" style="display:none; background:transparent; border:none;">
            <button class="btn-glass" style="border-color:var(--red); color:var(--red);" onclick="zenHangup()">🔴 วางสาย (คลายจิตสลาย Voxel)</button>
        </div>
    </div>

    <div id="contact-drawer">
        <div class="drawer-handle" onclick="toggleContactDrawer()"></div>
        <div style="color:var(--green); font-size:0.85rem; font-weight:bold; margin-bottom:15px; text-align:center;">👥 บัญชีสหายธรรม (ทุกค่าย ทุกระบบ)</div>
        <div class="contact-item"><span>สหายทอม</span><button class="btn-call" onclick="sendSpore('สหายทอม')">ส่งสปอร์</button></div>
        <div class="contact-item"><span>สหายแอนดรอยด์</span><button class="btn-call" onclick="sendSpore('สหายแอนดรอยด์')">ส่งสปอร์</button></div>
        <button class="btn-glass" style="margin-top:10px; border-color:var(--red); color:var(--red);" onclick="toggleContactDrawer()">พับเก็บ</button>
    </div>

    <video id="remoteVideo" autoplay playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const SYS = { state: 'ZEN', myId: null, currentCall: null, targetSpore: null };
        let audioCtx, analyzer, dataArray, localStream;

        // In-App Detection
        const ua = navigator.userAgent || "";
        if (/FBAN|FBAV|Line/i.test(ua)) document.getElementById('in-app-escape').style.display = 'flex';

        // Audio Chime
        window.playZenChime = () => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [880, 1320].forEach((f, i) => {
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination); osc.frequency.value = f;
                g.gain.setValueAtTime(0, now + i*0.15);
                g.gain.linearRampToValueAtTime(0.2, now + i*0.15 + 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, now + i*0.15 + 0.6);
                osc.start(now + i*0.15); osc.stop(now + i*0.15 + 0.6);
            });
        };

        // Graph-driven UI Engine (Quantum Bodhi Gate)
        const quantumGateGraph = {
            tag: 'div', id: 'welcome-gate',
            children: [{
                tag: 'div', className: 'gate-box',
                children: [
                    { tag: 'div', className: 'cyber-title', text: 'UBA :: QUANTUM_BODHI_GATE' },
                    { tag: 'h2', style: 'color:var(--white); margin-bottom:15px; font-size:1.2rem;', text: 'ประสานจิตผ่านโครงข่ายจักรวาล' },
                    { tag: 'p', style: 'font-size:0.8rem; color:#aaa; line-height:1.6; margin-bottom:25px;', html: 'เชิญเข้าสู่มิติ <span style="color:var(--cyan);">Voxel Quantum OS</span><br><br><span style="color:var(--gold); font-size:0.75rem;">[ ระบบต้องการคลื่นเสียงเพื่อสร้างโฮโลแกรม ]</span>' },
                    { tag: 'button', className: 'btn-glass', style: 'border-color:var(--cyan); color:var(--white); background:rgba(0,243,255,0.15);', text: '✨ น้อมรับการประสานจิต (Initialize)', onClick: () => acceptSpore() }
                ]
            }]
        };

        function manifestGraph(node, parent) {
            const el = document.createElement(node.tag);
            if(node.id) el.id = node.id;
            if(node.className) el.className = node.className;
            if(node.style) el.style.cssText = node.style;
            if(node.text) el.innerText = node.text;
            if(node.html) el.innerHTML = node.html;
            if(node.onClick) el.onclick = node.onClick;
            if(node.children) node.children.forEach(c => manifestGraph(c, el));
            parent.appendChild(el);
            return el;
        }

        // PeerJS Signaling
        const peer = new Peer();
        peer.on('open', (id) => {
            SYS.myId = id;
            document.getElementById('my-spore-id').innerText = `สปอร์ ID: พร้อม`;
            const spore = new URLSearchParams(window.location.search).get('spore');
            if(spore && spore !== id) { SYS.targetSpore = spore; manifestGraph(quantumGateGraph, document.body); }
        });

        peer.on('call', async (call) => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                call.answer(localStream);
                bindCallEvents(call);
            } catch(e) { alert("โปรดอนุญาตไมโครโฟน"); }
        });

        window.acceptSpore = async () => {
            document.getElementById('welcome-gate').remove();
            document.getElementById('eco-status').innerText = "กำลังประสานจิต...";
            playZenChime();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                bindCallEvents(peer.call(SYS.targetSpore, localStream));
            } catch(e) { alert("การเชื่อมจิตล้มเหลว"); window.location.href = window.location.pathname; }
        };

        window.toggleContactDrawer = () => document.getElementById('contact-drawer').classList.toggle('open');
        window.sendSpore = async (name) => {
            playZenChime(); toggleContactDrawer();
            const url = `${window.location.origin}${window.location.pathname}?spore=${SYS.myId}`;
            if(navigator.share) {
                try { await navigator.share({ title: 'Voxel Quantum OS', text: `[สปอร์ไมโครไรซา] เชื่อมจิตกันเถอะ ${name}!`, url }); } catch(e){}
            } else { navigator.clipboard.writeText(url); alert("คัดลอกสปอร์แล้ว ส่งให้เพื่อนได้เลย!"); }
            document.getElementById('eco-status').innerText = "รอเพื่อนรับสปอร์...";
        };

        function bindCallEvents(call) {
            SYS.currentCall = call;
            call.on('stream', (stream) => {
                document.getElementById('remoteVideo').srcObject = stream;
                setupAudioReactive(stream);
                document.getElementById('main-controls').style.display = 'none';
                document.getElementById('call-controls').style.display = 'block';
                document.getElementById('eco-status').innerText = "เชื่อมจิตสำเร็จ (Telepresence)";
                document.getElementById('eco-status').style.color = "var(--green)";
                SYS.state = 'MANIFEST'; voxelMesh.visible = true; coreShape.visible = false;
            });
            call.on('close', () => zenHangup(true));
        }

        window.zenHangup = (remote = false) => {
            if(!remote) playZenChime();
            if(SYS.currentCall) SYS.currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            SYS.state = 'ZEN';
            document.getElementById('main-controls').style.display = 'block';
            document.getElementById('call-controls').style.display = 'none';
            document.getElementById('eco-status').innerText = "ฌานสมาบัติ";
            document.getElementById('eco-status').style.color = "var(--gold)";
            voxelMesh.visible = false; coreShape.visible = true;
            if(SYS.targetSpore) window.location.href = window.location.pathname;
        };

        function setupAudioReactive(stream) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyzer = audioCtx.createAnalyser(); analyzer.fftSize = 256;
            audioCtx.createMediaStreamSource(stream).connect(analyzer);
            dataArray = new Uint8Array(analyzer.frequencyBinCount);
        }

        // Three.js Universe
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 10);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.1));

        const coreShape = new THREE.Mesh(new THREE.TorusKnotGeometry(1.2, 0.3, 64, 16), new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true, transparent: true, opacity: 0.5 }));
        scene.add(coreShape);

        const MAX_V = 800;
        const vMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 1.0 });
        const uniforms = { uTime: { value: 0 }, uAudio: { value: 0 }, uDissolve: { value: 0 } };
        vMat.onBeforeCompile = (sh) => {
            sh.uniforms.uTime = uniforms.uTime; sh.uniforms.uAudio = uniforms.uAudio;
            sh.vertexShader = `uniform float uTime; uniform float uAudio; attribute vec3 aRnd;` + sh.vertexShader;
            sh.vertexShader = sh.vertexShader.replace(`#include <begin_vertex>`, `
                vec3 pos = aRnd + vec3(sin(uTime+aRnd.x), cos(uTime+aRnd.y), sin(uTime+aRnd.z)) * (0.2 + uAudio * 0.6);
                vec3 transformed = mix(pos, normalize(aRnd) * 3.5, 0.5);
            `);
            sh.fragmentShader = `uniform float uAudio;` + sh.fragmentShader;
            sh.fragmentShader = sh.fragmentShader.replace(`vec4 diffuseColor = vec4( diffuse, opacity );`, `
                vec4 diffuseColor = vec4( mix(diffuse, vec3(0,1,1), uAudio), opacity );
            `);
        };

        const voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), vMat, MAX_V);
        const rndArr = new Float32Array(MAX_V * 3);
        for(let i=0; i<MAX_V*3; i++) rndArr[i] = (Math.random()-0.5)*8;
        voxelMesh.geometry.setAttribute('aRnd', new THREE.InstancedBufferAttribute(rndArr, 3));
        voxelMesh.visible = false; scene.add(voxelMesh); scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta(), t = clock.getElapsedTime();
            if(analyzer && dataArray) {
                analyzer.getByteFrequencyData(dataArray);
                let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                uniforms.uAudio.value += ((sum / dataArray.length / 255.0) - uniforms.uAudio.value) * dt * 10;
            }
            if(SYS.state === 'ZEN') { coreShape.rotation.x += dt*0.2; coreShape.rotation.y += dt*0.4; }
            else { uniforms.uTime.value = t; voxelMesh.rotation.y = Math.sin(t*0.2)*0.3; }
            composer.render();
        }
        animate();
    </script>
</body>
</html>
