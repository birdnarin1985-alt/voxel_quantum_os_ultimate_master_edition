<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voxel Quantum OS : M&M Candy Edition</title>
    <style>
        :root { --bg: #0a0c10; --cyan: #00f3ff; --gold: #f39c12; --pink: #ff3399; --yellow: #ffcc00; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--white); touch-action: none; }
        #webgl-canvas { position: absolute; inset: 0; z-index: 1; }
        .glass-box { background: rgba(20, 25, 35, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(25px); border-radius: 24px; padding: 25px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        .btn-quantum { background: linear-gradient(135deg, #ff3399, #ffcc00); border: none; color: #fff; padding: 14px; border-radius: 16px; font-size: 0.9rem; font-weight: bold; cursor: pointer; width: 100%; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(255,51,153,0.4); }
        .btn-quantum:active { transform: scale(0.95); }
        .quantum-input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3); color: var(--yellow); padding: 12px; border-radius: 14px; width: 100%; text-align: center; font-size: 0.9rem; font-family: monospace; outline: none; margin-bottom: 12px; }
        #name-gate { position: fixed; inset: 0; background: rgba(5,6,10,0.96); z-index: 20000; display: flex; justify-content: center; align-items: center; padding: 25px; backdrop-filter: blur(30px); }
        audio, video { display: none; }
    </style>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.150.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/" } }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <audio id="remoteAudio" autoplay playsinline></audio>

    <!-- ประตูต้อนรับสีสันสดใส -->
    <div id="name-gate">
        <div class="glass-box" style="max-width:360px; width:100%;">
            <div style="color:var(--yellow); font-size:0.85rem; margin-bottom:8px; font-family:monospace;">🍬 M&M QUANTUM PLAYGROUND</div>
            <h2 style="font-size:1.2rem; margin-bottom:15px; color:var(--white);">ตั้งชื่อนักผจญภัยตัวน้อย</h2>
            <input type="text" id="alias-input" class="quantum-input" placeholder="เช่น น้องส้มจี๊ด, พี่ช็อคโกแลต..." maxlength="20">
            <button class="btn-quantum" onclick="window.saveAliasAndStart()">🚀 ลุยเข้าสวนสนุกควอนตัม</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let myAlias = localStorage.getItem('voxel_alias') || '';
        if(myAlias) document.getElementById('name-gate').style.display = 'none';

        // โครงสร้าง UI ด้วย Graph Pointer
        const cosmicGraph = {
            tag: 'div', id: 'ui-layer', style: 'position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:20px;',
            children: [
                {
                    tag: 'div', style: 'display:flex; justify-content:space-between; pointer-events:auto; gap:8px; flex-wrap:wrap;',
                    children: [
                        { tag: 'div', id: 'my-spore-id', style: 'background:rgba(20,25,35,0.8); border:1px solid var(--cyan); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--cyan); font-family:monospace;', text: 'ID: กำลังเชื่อม...' },
                        { tag: 'div', id: 'bitrate-meter', style: 'background:rgba(20,25,35,0.8); border:1px solid var(--yellow); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--yellow); font-family:monospace;', text: '🍬 ลูกกวาด: 0.0 KB/s' },
                        { tag: 'div', id: 'eco-status', style: 'background:rgba(20,25,35,0.8); border:1px solid var(--pink); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--pink); font-family:monospace;', text: 'พร้อมสนุก' }
                    ]
                },
                {
                    tag: 'div', id: 'hud-main', style: 'pointer-events:auto; max-width:380px; width:100%; margin:0 auto;',
                    children: [
                        {
                            tag: 'div', className: 'glass-box',
                            children: [
                                { tag: 'div', id: 'display-my-name', style: 'color:var(--yellow); font-size:0.8rem; margin-bottom:12px; font-family:monospace;', text: `นักผจญภัย: ${myAlias || 'ผู้มาเยือน'}` },
                                { tag: 'input', id: 'friend-id-input', className: 'quantum-input', placeholder: 'วางรหัสเพื่อนที่นี่...' },
                                { tag: 'button', className: 'btn-quantum', style: 'margin-bottom:10px;', text: '🎉 โทรหาเพื่อน (M&M Call)', onClick: () => window.callFriend() },
                                { tag: 'button', className: 'btn-quantum', style: 'background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); font-size:0.75rem;', text: '📋 คัดลอกรหัสของฉัน', onClick: () => window.sendSpore() }
                            ]
                        }
                    ]
                },
                {
                    tag: 'div', id: 'hud-call', style: 'pointer-events:auto; max-width:400px; width:100%; margin:0 auto; display:none;',
                    children: [
                        { tag: 'button', className: 'btn-quantum', style: 'background:linear-gradient(135deg, #ff3333, #ff9900);', text: '🔴 วางสาย (พักผ่อน)', onClick: () => window.zenHangup() }
                    ]
                }
            ]
        };

        function manifestGraph(node, parent) {
            const el = document.createElement(node.tag || 'div');
            if(node.id) el.id = node.id;
            if(node.className) el.className = node.className;
            if(node.style) el.style.cssText = node.style;
            if(node.text) el.innerText = node.text;
            if(node.html) el.innerHTML = node.html;
            if(node.onClick) el.onclick = node.onClick;
            if(node.children) node.children.forEach(c => manifestGraph(c, el));
            parent.appendChild(el);
            return el;
        }
        manifestGraph(cosmicGraph, document.body);

        window.saveAliasAndStart = () => {
            const val = document.getElementById('alias-input').value.trim();
            if(!val) { alert("โปรดใส่ชื่อนักผจญภัยก่อนครับ"); return; }
            localStorage.setItem('voxel_alias', val);
            myAlias = val;
            document.getElementById('display-my-name').innerText = `นักผจญภัย: ${myAlias}`;
            document.getElementById('name-gate').style.display = 'none';
            window.playZenChime();
        };

        const SYS = { state: 'PLAY', myId: null, currentCall: null, waitingTimer: null, statsInterval: null };
        let audioCtx, analyzer, dataArray, localStream;

        window.playZenChime = () => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99].forEach((f, i) => { // เสียงคอร์ดใสๆ ราวดนตรีกล่องดนตรี
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination); osc.frequency.value = f;
                g.gain.setValueAtTime(0, now + i*0.1); g.gain.linearRampToValueAtTime(0.15, now + i*0.1 + 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.5);
                osc.start(now + i*0.1); osc.stop(now + i*0.1 + 0.5);
            });
        };

        const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } });
        
        peer.on('open', (id) => {
            SYS.myId = id;
            document.getElementById('my-spore-id').innerText = `ID: ${id.substring(0,6)}...`;
        });

        peer.on('call', async (call) => {
            playZenChime();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                call.answer(localStream);
                bindCallEvents(call);
            } catch(e) { alert("โปรดอนุญาตไมโครโฟน"); }
        });

        window.sendSpore = async () => {
            playZenChime();
            if(navigator.clipboard) {
                await navigator.clipboard.writeText(SYS.myId);
                alert(`คัดลอกรหัสของ [${myAlias}] เรียบร้อย!\nส่งให้เพื่อนเอาไปวางเพื่อโทรหากันได้เลยครับ`);
            }
        };

        window.callFriend = async () => {
            const friendId = document.getElementById('friend-id-input').value.trim();
            if(!friendId) { alert("โปรดใส่รหัสของเพื่อนก่อนครับ"); return; }
            playZenChime();
            document.getElementById('eco-status').innerText = "กำลังโทรหาเพื่อน...";
            document.getElementById('eco-status').style.color = "var(--yellow)";
            SYS.state = 'WAITING';
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const call = peer.call(friendId, localStream);
                bindCallEvents(call);

                if(SYS.waitingTimer) clearTimeout(SYS.waitingTimer);
                SYS.waitingTimer = setTimeout(() => {
                    if(SYS.state === 'WAITING') {
                        alert("🧘 รอนานแล้ว... เกรงใจเพื่อนจัง พักสายก่อนนะจ๊ะ");
                        window.zenHangup();
                    }
                }, 30000);
            } catch(e) { 
                alert("เชื่อมต่อไม่สำเร็จ ตรวจสอบรหัสเพื่อน"); 
                window.zenHangup();
            }
        };

        function bindCallEvents(call) {
            SYS.currentCall = call;
            call.on('stream', (remoteStream) => {
                if(SYS.waitingTimer) clearTimeout(SYS.waitingTimer);
                const ra = document.getElementById('remoteAudio');
                ra.srcObject = remoteStream; ra.play().catch(e => {});
                setupAudioReactive(remoteStream);
                
                document.getElementById('hud-main').style.display = 'none';
                document.getElementById('hud-call').style.display = 'block';
                document.getElementById('eco-status').innerText = "กำลังคุยกันอยู่!";
                document.getElementById('eco-status').style.color = "var(--cyan)";
                
                SYS.state = 'SPEAKING';
                startBitrateMonitor(call);
            });
            call.on('close', () => window.zenHangup(true));
        }

        function startBitrateMonitor(call) {
            if(SYS.statsInterval) clearInterval(SYS.statsInterval);
            let lastBytes = 0;
            SYS.statsInterval = setInterval(async () => {
                try {
                    if(!call.peerConnection) return;
                    const stats = await call.peerConnection.getStats();
                    stats.forEach(report => {
                        if(report.type === 'inbound-rtp' && report.kind === 'audio') {
                            const bytes = report.bytesReceived;
                            if(lastBytes > 0) {
                                const kbps = (((bytes - lastBytes) * 8) / 1024).toFixed(1);
                                document.getElementById('bitrate-meter').innerText = `🍬 ลูกกวาด: ${kbps} KB/s`;
                            }
                            lastBytes = bytes;
                        }
                    });
                } catch(e) {}
            }, 1000);
        }

        window.zenHangup = (remote = false) => {
            if(SYS.waitingTimer) clearTimeout(SYS.waitingTimer);
            if(SYS.statsInterval) clearInterval(SYS.statsInterval);
            document.getElementById('bitrate-meter').innerText = `🍬 ลูกกวาด: 0.0 KB/s`;
            if(!remote) playZenChime();
            if(SYS.currentCall) SYS.currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            SYS.state = 'PLAY';
            document.getElementById('hud-main').style.display = 'block';
            document.getElementById('hud-call').style.display = 'none';
            document.getElementById('eco-status').innerText = "พร้อมสนุก";
            document.getElementById('eco-status').style.color = "var(--pink)";
        };

        function setupAudioReactive(stream) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            analyzer = audioCtx.createAnalyser(); analyzer.fftSize = 256;
            audioCtx.createMediaStreamSource(stream).connect(analyzer);
            dataArray = new Uint8Array(analyzer.frequencyBinCount);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 10);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.1));

        // 🍬 สร้างกองทัพลูกกวาด M&M Voxels สีสันสดใสหลากสี (ใช้ Vertex Colors แยกสีแต่ละก้อน)
        const MAX_V = 1000;
        const geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
        const material = new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0.1 });
        
        const voxelMesh = new THREE.InstancedMesh(geometry, material, MAX_V);
        const rndArr = new Float32Array(MAX_V * 3);
        const colorArr = new Float32Array(MAX_V * 3);
        
        // พาเลทสีลูกกวาด M&M (ส้ม, ชมพู, เหลือง, ฟ้า, เขียวสด, ม่วง)
        const candyColors = [
            new THREE.Color(0xff5722), // ส้ม
            new THREE.Color(0xe91e63), // ชมพู
            new THREE.Color(0xffeb3b), // เหลือง
            new THREE.Color(0x00bcd4), // ฟ้า
            new THREE.Color(0x8bc34a), // เขียว
            new THREE.Color(0x9c27b0)  // ม่วง
        ];

        const dummy = new THREE.Object3D();
        for(let i=0; i<MAX_V; i++) {
            rndArr[i*3] = (Math.random()-0.5)*7;
            rndArr[i*3+1] = (Math.random()-0.5)*7;
            rndArr[i*3+2] = (Math.random()-0.5)*7;
            
            const col = candyColors[Math.floor(Math.random() * candyColors.length)];
            voxelMesh.setColorAt(i, col);
        }
        voxelMesh.instanceColor.needsUpdate = true;
        scene.add(voxelMesh);
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const pointLight = new THREE.PointLight(0xffffff, 2, 50);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        // Custom Shader สำหรับแอนิเมชั่นลูกกวาดเต้นตามเสียง
        const uniforms = { uTime: { value: 0 }, uAudio: { value: 0 } };
        material.onBeforeCompile = (sh) => {
            sh.uniforms.uTime = uniforms.uTime; sh.uniforms.uAudio = uniforms.uAudio;
            sh.vertexShader = `uniform float uTime; uniform float uAudio; attribute vec3 aRnd;` + sh.vertexShader;
            // ใช้ข้อมูลสุ่มประจำพาร์ติเคิลผสมกับตำแหน่ง Rnd
            sh.vertexShader = sh.vertexShader.replace(`#include <begin_vertex>`, `
                vec3 pos = position;
            `);
        };

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta(), t = clock.getElapsedTime();
            uniforms.uTime.value = t;

            if(analyzer && dataArray) {
                analyzer.getByteFrequencyData(dataArray);
                let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                uniforms.uAudio.value += ((sum / dataArray.length / 255.0) - uniforms.uAudio.value) * dt * 10;
            }

            // ขยับกองทัพลูกกวาด M&M ให้เด้งดึ๋งสนุกสนานตลอดเวลา ไม่มืดแน่นอน!
            const audioFactor = uniforms.uAudio.value;
            for(let i=0; i<MAX_V; i++) {
                const rx = Math.sin(t * 1.5 + i) * (0.8 + audioFactor * 2.0);
                const ry = Math.cos(t * 1.2 + i * 0.5) * (0.8 + audioFactor * 2.0);
                const rz = Math.sin(t * 1.0 + i * 0.3) * (0.8 + audioFactor * 2.0);
                
                dummy.position.set(
                    Math.sin(i + t * 0.5) * 2.5 + rx * 0.3,
                    Math.cos(i * 0.7 + t * 0.4) * 2.5 + ry * 0.3,
                    Math.sin(i * 0.3 + t * 0.3) * 1.5 + rz * 0.3
                );
                
                // สเกลลูกกวาดให้เด้งตามเสียงพูด
                const scale = 0.8 + Math.sin(t * 5 + i) * 0.2 + (SYS.state === 'SPEAKING' ? audioFactor * 1.2 : 0);
                dummy.scale.set(scale, scale, scale);
                dummy.rotation.x = t + i;
                dummy.rotation.y = t * 0.8;
                
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(i, dummy.matrix);
            }
            voxelMesh.instanceMatrix.needsUpdate = true;

            voxelMesh.rotation.y = t * 0.15;
            composer.render();
        }
        animate();
    </script>
</body>
</html>
