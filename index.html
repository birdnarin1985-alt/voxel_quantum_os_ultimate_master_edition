<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voxel Quantum OS : Master Fix Edition</title>
    <style>
        :root { --bg: #010203; --cyan: #00f3ff; --gold: #f39c12; --green: #00ff66; --red: #ff3366; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--white); touch-action: none; }
        #webgl-canvas { position: absolute; inset: 0; z-index: 1; }
        .glass-box { background: rgba(0, 10, 15, 0.85); border: 1px solid rgba(0, 243, 255, 0.3); backdrop-filter: blur(25px); border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 0 40px rgba(0, 243, 255, 0.15); }
        .btn-quantum { background: rgba(0, 243, 255, 0.15); border: 1px solid var(--cyan); color: var(--white); padding: 12px; border-radius: 14px; font-size: 0.85rem; font-weight: bold; cursor: pointer; width: 100%; transition: transform 0.2s; }
        .btn-quantum:active { transform: scale(0.95); }
        .quantum-input { background: rgba(0,0,0,0.6); border: 1px solid rgba(0,243,255,0.4); color: var(--cyan); padding: 12px; border-radius: 12px; width: 100%; text-align: center; font-size: 0.85rem; font-family: monospace; outline: none; margin-bottom: 12px; }
        #name-gate { position: fixed; inset: 0; background: rgba(1,2,3,0.95); z-index: 20000; display: flex; justify-content: center; align-items: center; padding: 25px; backdrop-filter: blur(30px); }
        audio, video { display: none; }
    </style>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.150.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/" } }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <audio id="remoteAudio" autoplay playsinline></audio>

    <div id="name-gate">
        <div class="glass-box" style="max-width:360px; width:100%;">
            <div style="color:var(--gold); font-size:0.8rem; margin-bottom:8px; font-family:monospace;">🪷 Voxel Quantum OS</div>
            <h2 style="font-size:1.1rem; margin-bottom:15px; color:var(--white);">ตั้งนามสหายธรรมของคุณ</h2>
            <input type="text" id="alias-input" class="quantum-input" placeholder="เช่น ช่างเบิร์ด, สหายเซน..." maxlength="20">
            <button class="btn-quantum" style="border-color:var(--cyan); background:rgba(0,243,255,0.2);" onclick="window.saveAliasAndStart()">✨ เข้าสู่มิติควอนตัม</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let myAlias = localStorage.getItem('voxel_alias') || '';
        if(myAlias) document.getElementById('name-gate').style.display = 'none';

        const cosmicGraph = {
            tag: 'div', id: 'ui-layer', style: 'position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:20px;',
            children: [
                {
                    tag: 'div', style: 'display:flex; justify-content:space-between; pointer-events:auto; gap:8px; flex-wrap:wrap;',
                    children: [
                        { tag: 'div', id: 'my-spore-id', style: 'background:rgba(0,0,0,0.6); border:1px solid var(--cyan); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--cyan); font-family:monospace;', text: 'ID: กำลังเชื่อม...' },
                        { tag: 'div', id: 'bitrate-meter', style: 'background:rgba(0,0,0,0.6); border:1px solid var(--green); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--green); font-family:monospace;', text: '🌿 สปอร์: 0.0 KB/s' },
                        { tag: 'div', id: 'eco-status', style: 'background:rgba(0,0,0,0.6); border:1px solid var(--gold); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--gold); font-family:monospace;', text: 'ฌานสมาบัติ' }
                    ]
                },
                {
                    tag: 'div', id: 'hud-main', style: 'pointer-events:auto; max-width:380px; width:100%; margin:0 auto;',
                    children: [
                        {
                            tag: 'div', className: 'glass-box',
                            children: [
                                { tag: 'div', id: 'display-my-name', style: 'color:var(--gold); font-size:0.75rem; margin-bottom:10px; font-family:monospace;', text: `นามสปอร์: ${myAlias || 'นิรนาม'}` },
                                { tag: 'input', id: 'friend-id-input', className: 'quantum-input', placeholder: 'วางรหัสสปอร์ของเพื่อนที่นี่...' },
                                { tag: 'button', className: 'btn-quantum', style: 'border-color:var(--green); color:var(--green); background:rgba(0,255,102,0.15); margin-bottom:8px;', text: '✨ เชื่อมจิตทันที (Direct Dial)', onClick: () => window.callFriend() },
                                { tag: 'button', className: 'btn-quantum', style: 'border-color:var(--cyan); color:var(--cyan); background:rgba(0,243,255,0.1); font-size:0.75rem;', text: '🍄 คัดลอกรหัสสปอร์ส่งให้เพื่อน', onClick: () => window.sendSpore() }
                            ]
                        }
                    ]
                },
                {
                    tag: 'div', id: 'hud-call', style: 'pointer-events:auto; max-width:400px; width:100%; margin:0 auto; display:none;',
                    children: [
                        { tag: 'button', className: 'btn-quantum', style: 'border-color:var(--red); color:var(--red); background:rgba(255,51,102,0.15);', text: '🔴 วางสาย (เกรงใจเพื่อน / คลายจิต)', onClick: () => window.zenHangup() }
                    ]
                }
            ]
        };

        function manifestGraph(node, parent) {
            const el = document.createElement(node.tag || 'div');
            if(node.id) el.id = node.id;
            if(node.className) el.className = node.className;
            if(node.style) el.style.cssText = node.style;
            if(node.text) el.innerText = node.text;
            if(node.html) el.innerHTML = node.html;
            if(node.onClick) el.onclick = node.onClick;
            if(node.children) node.children.forEach(c => manifestGraph(c, el));
            parent.appendChild(el);
            return el;
        }
        manifestGraph(cosmicGraph, document.body);

        window.saveAliasAndStart = () => {
            const val = document.getElementById('alias-input').value.trim();
            if(!val) { alert("โปรดใส่นามสหายธรรมก่อนครับ"); return; }
            localStorage.setItem('voxel_alias', val);
            myAlias = val;
            document.getElementById('display-my-name').innerText = `นามสปอร์: ${myAlias}`;
            document.getElementById('name-gate').style.display = 'none';
            window.playZenChime();
        };

        const SYS = { state: 'ZEN', myId: null, currentCall: null, waitingTimer: null, statsInterval: null };
        let audioCtx, analyzer, dataArray, localStream;

        window.playZenChime = () => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [880, 1320].forEach((f, i) => {
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination); osc.frequency.value = f;
                g.gain.setValueAtTime(0, now + i*0.15); g.gain.linearRampToValueAtTime(0.2, now + i*0.15 + 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, now + i*0.15 + 0.6);
                osc.start(now + i*0.15); osc.stop(now + i*0.15 + 0.6);
            });
        };

        const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } });
        
        peer.on('open', (id) => {
            SYS.myId = id;
            document.getElementById('my-spore-id').innerText = `ID: ${id.substring(0,6)}...`;
        });

        peer.on('call', async (call) => {
            playZenChime();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                call.answer(localStream);
                bindCallEvents(call);
            } catch(e) { alert("โปรดอนุญาตไมโครโฟน"); }
        });

        window.sendSpore = async () => {
            playZenChime();
            if(navigator.clipboard) {
                await navigator.clipboard.writeText(SYS.myId);
                alert(`คัดลอกรหัสสปอร์ของ [${myAlias}] เรียบร้อย!\nส่งให้เพื่อนเอาไปใส่ช่อง Direct Dial ได้เลยครับ`);
            }
        };

        window.callFriend = async () => {
            const friendId = document.getElementById('friend-id-input').value.trim();
            if(!friendId) { alert("โปรดใส่รหัสสปอร์ของเพื่อนก่อนครับ"); return; }
            playZenChime();
            document.getElementById('eco-status').innerText = "กำลังต่อสายเชื่อมจิต...";
            document.getElementById('eco-status').style.color = "var(--gold)";
            SYS.state = 'WAITING';
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const call = peer.call(friendId, localStream);
                bindCallEvents(call);

                if(SYS.waitingTimer) clearTimeout(SYS.waitingTimer);
                SYS.waitingTimer = setTimeout(() => {
                    if(SYS.state === 'WAITING') {
                        alert("🧘 รอนานเกินไปแล้ว... เกรงใจเพื่อนจัง พักสายก่อนนะ สาธุ");
                        window.zenHangup();
                    }
                }, 30000);
            } catch(e) { 
                alert("การเชื่อมจิตล้มเหลว ตรวจสอบรหัสเพื่อน"); 
                window.zenHangup();
            }
        };

        function bindCallEvents(call) {
            SYS.currentCall = call;
            call.on('stream', (remoteStream) => {
                if(SYS.waitingTimer) clearTimeout(SYS.waitingTimer);
                const ra = document.getElementById('remoteAudio');
                ra.srcObject = remoteStream; ra.play().catch(e => {});
                setupAudioReactive(remoteStream);
                
                document.getElementById('hud-main').style.display = 'none';
                document.getElementById('hud-call').style.display = 'block';
                document.getElementById('eco-status').innerText = "เชื่อมจิตสำเร็จ";
                document.getElementById('eco-status').style.color = "var(--green)";
                
                // ☸️ บังคับเปลี่ยนสถานะและเปิดแสดงผลอนุภาค Voxel ทันที
                SYS.state = 'MANIFEST'; 
                voxelMesh.visible = true; 
                coreShape.visible = false;

                startBitrateMonitor(call);
            });
            call.on('close', () => window.zenHangup(true));
        }

        function startBitrateMonitor(call) {
            if(SYS.statsInterval) clearInterval(SYS.statsInterval);
            let lastBytes = 0;
            SYS.statsInterval = setInterval(async () => {
                try {
                    if(!call.peerConnection) return;
                    const stats = await call.peerConnection.getStats();
                    stats.forEach(report => {
                        if(report.type === 'inbound-rtp' && report.kind === 'audio') {
                            const bytes = report.bytesReceived;
                            if(lastBytes > 0) {
                                const kbps = (((bytes - lastBytes) * 8) / 1024).toFixed(1);
                                document.getElementById('bitrate-meter').innerText = `🌿 สปอร์: ${kbps} KB/s`;
                            }
                            lastBytes = bytes;
                        }
                    });
                } catch(e) {}
            }, 1000);
        }

        window.zenHangup = (remote = false) => {
            if(SYS.waitingTimer) clearTimeout(SYS.waitingTimer);
            if(SYS.statsInterval) clearInterval(SYS.statsInterval);
            document.getElementById('bitrate-meter').innerText = `🌿 สปอร์: 0.0 KB/s`;
            if(!remote) playZenChime();
            if(SYS.currentCall) SYS.currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            SYS.state = 'ZEN';
            document.getElementById('hud-main').style.display = 'block';
            document.getElementById('hud-call').style.display = 'none';
            document.getElementById('eco-status').innerText = "ฌานสมาบัติ";
            document.getElementById('eco-status').style.color = "var(--gold)";
            voxelMesh.visible = false; coreShape.visible = true;
        };

        function setupAudioReactive(stream) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            analyzer = audioCtx.createAnalyser(); analyzer.fftSize = 256;
            audioCtx.createMediaStreamSource(stream).connect(analyzer);
            dataArray = new Uint8Array(analyzer.frequencyBinCount);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 10);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.1));

        const coreShape = new THREE.Mesh(new THREE.TorusKnotGeometry(1.2, 0.3, 64, 16), new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true, transparent: true, opacity: 0.5 }));
        scene.add(coreShape);

        const MAX_V = 800;
        const vMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 1.5 });
        const uniforms = { uTime: { value: 0 }, uAudio: { value: 0 } };
        vMat.onBeforeCompile = (sh) => {
            sh.uniforms.uTime = uniforms.uTime; sh.uniforms.uAudio = uniforms.uAudio;
            sh.vertexShader = `uniform float uTime; uniform float uAudio; attribute vec3 aRnd;` + sh.vertexShader;
            sh.vertexShader = sh.vertexShader.replace(`#include <begin_vertex>`, `
                vec3 pos = aRnd + vec3(sin(uTime+aRnd.x), cos(uTime+aRnd.y), sin(uTime+aRnd.z)) * (0.2 + uAudio * 1.5);
                vec3 transformed = mix(pos, normalize(aRnd) * 3.5, 0.5);
            `);
            sh.fragmentShader = `uniform float uAudio;` + sh.fragmentShader;
            sh.fragmentShader = sh.fragmentShader.replace(`vec4 diffuseColor = vec4( diffuse, opacity );`, `
                vec4 diffuseColor = vec4( mix(diffuse, vec3(0,1,1), uAudio), opacity );
            `);
        };

        const voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), vMat, MAX_V);
        const rndArr = new Float32Array(MAX_V * 3);
        for(let i=0; i<MAX_V*3; i++) rndArr[i] = (Math.random()-0.5)*8;
        voxelMesh.geometry.setAttribute('aRnd', new THREE.InstancedBufferAttribute(rndArr, 3));
        voxelMesh.visible = false; scene.add(voxelMesh); scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta(), t = clock.getElapsedTime();
            if(analyzer && dataArray) {
                analyzer.getByteFrequencyData(dataArray);
                let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                uniforms.uAudio.value += ((sum / dataArray.length / 255.0) - uniforms.uAudio.value) * dt * 10;
            }
            
            // ส่งค่า uTime เสมอเพื่อให้อนุภาคขยับตัวและเรืองแสงตลอดเวลาเมื่ออยู่ในสถานะ MANIFEST หรือ WAITING
            uniforms.uTime.value = t;

            if(SYS.state === 'ZEN') { 
                coreShape.rotation.x += dt*0.2; 
                coreShape.rotation.y += dt*0.4; 
            } else if(SYS.state === 'WAITING') {
                coreShape.rotation.x += dt*0.8; 
                coreShape.rotation.y += dt*1.2; 
            } else { 
                voxelMesh.rotation.y = Math.sin(t*0.2)*0.3; 
            }
            composer.render();
        }
        animate();
    </script>
</body>
</html>
