<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voxel Quantum OS : Event-Driven Mycorrhiza</title>
    <style>
        :root { --bg: #050608; --cyan: #00f3ff; --gold: #f39c12; --pink: #ff3399; --yellow: #ffcc00; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--white); touch-action: none; }
        #webgl-canvas { position: absolute; inset: 0; z-index: 1; }
        .glass-box { background: rgba(15, 20, 30, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); border-radius: 24px; padding: 25px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .btn-quantum { background: linear-gradient(135deg, #00f3ff, #ff3399); border: none; color: #fff; padding: 14px; border-radius: 16px; font-size: 0.9rem; font-weight: bold; cursor: pointer; width: 100%; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(0,243,255,0.3); }
        .btn-quantum:active { transform: scale(0.95); }
        .quantum-input { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: var(--cyan); padding: 12px; border-radius: 14px; width: 100%; text-align: center; font-size: 0.9rem; font-family: monospace; outline: none; margin-bottom: 12px; }
        #name-gate { position: fixed; inset: 0; background: rgba(2,3,5,0.98); z-index: 20000; display: flex; justify-content: center; align-items: center; padding: 25px; backdrop-filter: blur(30px); }
        audio, video { display: none; }
    </style>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.150.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/" } }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <audio id="remoteAudio" autoplay playsinline></audio>

    <div id="name-gate">
        <div class="glass-box" style="max-width:360px; width:100%;">
            <div style="color:var(--cyan); font-size:0.85rem; margin-bottom:8px; font-family:monospace;">🍄 MYCORRHIZAL EVENT OS</div>
            <h2 style="font-size:1.1rem; margin-bottom:15px; color:var(--white);">นามผู้ร่วมโครงข่าย</h2>
            <input type="text" id="alias-input" class="quantum-input" placeholder="เช่น สหายไมโครไรซา..." maxlength="20">
            <button class="btn-quantum" onclick="window.saveAliasAndStart()">✨ เชื่อมร้อยโครงข่าย</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let myAlias = localStorage.getItem('voxel_alias') || '';
        if(myAlias) document.getElementById('name-gate').style.display = 'none';

        // UI Graph Pointer
        const cosmicGraph = {
            tag: 'div', id: 'ui-layer', style: 'position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:20px;',
            children: [
                {
                    tag: 'div', style: 'display:flex; justify-content:space-between; pointer-events:auto; gap:8px; flex-wrap:wrap;',
                    children: [
                        { tag: 'div', id: 'my-spore-id', style: 'background:rgba(10,15,25,0.8); border:1px solid var(--cyan); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--cyan); font-family:monospace;', text: 'ID: กำลังตื่น...' },
                        { tag: 'div', id: 'bitrate-meter', style: 'background:rgba(10,15,25,0.8); border:1px solid var(--green); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--green); font-family:monospace;', text: '🌿 Event: Sleep' },
                        { tag: 'div', id: 'eco-status', style: 'background:rgba(10,15,25,0.8); border:1px solid var(--gold); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--gold); font-family:monospace;', text: 'สมาธิ' }
                    ]
                },
                {
                    tag: 'div', id: 'hud-main', style: 'pointer-events:auto; max-width:380px; width:100%; margin:0 auto;',
                    children: [
                        {
                            tag: 'div', className: 'glass-box',
                            children: [
                                { tag: 'div', id: 'display-my-name', style: 'color:var(--cyan); font-size:0.8rem; margin-bottom:12px; font-family:monospace;', text: `โหนด: ${myAlias || 'นิรนาม'}` },
                                { tag: 'input', id: 'friend-id-input', className: 'quantum-input', placeholder: 'วางรหัสเพื่อนเพื่อปลุกโหนด...' },
                                { tag: 'button', className: 'btn-quantum', style: 'margin-bottom:10px;', text: '⚡ ส่ง Spore Event ปลุกเพื่อน', onClick: () => window.callFriend() },
                                { tag: 'button', className: 'btn-quantum', style: 'background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); font-size:0.75rem;', text: '📋 คัดลอกรหัสโหนดของฉัน', onClick: () => window.sendSpore() }
                            ]
                        }
                    ]
                },
                {
                    tag: 'div', id: 'hud-call', style: 'pointer-events:auto; max-width:400px; width:100%; margin:0 auto; display:none;',
                    children: [
                        { tag: 'button', className: 'btn-quantum', style: 'background:linear-gradient(135deg, #ff3333, #ff9900);', text: '🔴 ตัดการเชื่อมโยง Event (วางสาย)', onClick: () => window.zenHangup() }
                    ]
                }
            ]
        };

        function manifestGraph(node, parent) {
            const el = document.createElement(node.tag || 'div');
            if(node.id) el.id = node.id;
            if(node.className) el.className = node.className;
            if(node.style) el.style.cssText = node.style;
            if(node.text) el.innerText = node.text;
            if(node.html) el.innerHTML = node.html;
            if(node.onClick) el.onclick = node.onClick;
            if(node.children) node.children.forEach(c => manifestGraph(c, el));
            parent.appendChild(el);
            return el;
        }
        manifestGraph(cosmicGraph, document.body);

        window.saveAliasAndStart = () => {
            const val = document.getElementById('alias-input').value.trim();
            if(!val) { alert("โปรดใส่ชื่อโหนดก่อนครับ"); return; }
            localStorage.setItem('voxel_alias', val);
            myAlias = val;
            document.getElementById('display-my-name').innerText = `โหนด: ${myAlias}`;
            document.getElementById('name-gate').style.display = 'none';
            window.playZenChime();
        };

        const SYS = { state: 'SLEEP', myId: null, currentCall: null, dataChannel: null };
        let audioCtx, analyzer, dataArray, localStream;

        window.playZenChime = () => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [440, 660, 880].forEach((f, i) => {
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination); osc.frequency.value = f;
                g.gain.setValueAtTime(0, now + i*0.08); g.gain.linearRampToValueAtTime(0.1, now + i*0.08 + 0.03);
                g.gain.exponentialRampToValueAtTime(0.001, now + i*0.08 + 0.4);
                osc.start(now + i*0.08); osc.stop(now + i*0.08 + 0.4);
            });
        };

        const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } });
        
        peer.on('open', (id) => {
            SYS.myId = id;
            document.getElementById('my-spore-id').innerText = `ID: ${id.substring(0,6)}...`;
        });

        peer.on('call', async (call) => {
            playZenChime();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                call.answer(localStream);
                bindCallEvents(call);
            } catch(e) { alert("โปรดอนุญาตไมโครโฟน"); }
        });

        window.sendSpore = async () => {
            playZenChime();
            if(navigator.clipboard) {
                await navigator.clipboard.writeText(SYS.myId);
                alert(`คัดลอกรหัสโหนด [${myAlias}] เรียบร้อย!\nส่งให้เพื่อนเพื่อส่ง Spore Event หากันได้เลย`);
            }
        };

        window.callFriend = async () => {
            const friendId = document.getElementById('friend-id-input').value.trim();
            if(!friendId) { alert("โปรดใส่รหัสเพื่อนก่อนครับ"); return; }
            playZenChime();
            document.getElementById('eco-status').innerText = "กำลังส่ง Spore Event...";
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const call = peer.call(friendId, localStream);
                bindCallEvents(call);
            } catch(e) { 
                alert("เชื่อมโยงไม่สำเร็จ"); 
                window.zenHangup();
            }
        };

        function bindCallEvents(call) {
            SYS.currentCall = call;
            call.on('stream', (remoteStream) => {
                const ra = document.getElementById('remoteAudio');
                ra.srcObject = remoteStream; ra.play().catch(e => {});
                setupAudioReactive(remoteStream);
                
                document.getElementById('hud-main').style.display = 'none';
                document.getElementById('hud-call').style.display = 'block';
                document.getElementById('eco-status').innerText = "โครงข่ายตื่นรู้ (Active)";
                document.getElementById('eco-status').style.color = "var(--cyan)";
                document.getElementById('bitrate-meter').innerText = `⚡ Event: Woke`;
                
                SYS.state = 'AWAKE';
            });
            call.on('close', () => window.zenHangup(true));
        }

        window.zenHangup = (remote = false) => {
            if(!remote) playZenChime();
            if(SYS.currentCall) SYS.currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            SYS.state = 'SLEEP';
            document.getElementById('hud-main').style.display = 'block';
            document.getElementById('hud-call').style.display = 'none';
            document.getElementById('eco-status').innerText = "สมาธิ";
            document.getElementById('eco-status').style.color = "var(--gold)";
            document.getElementById('bitrate-meter').innerText = `🌿 Event: Sleep`;
        };

        function setupAudioReactive(stream) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            analyzer = audioCtx.createAnalyser(); analyzer.fftSize = 256;
            audioCtx.createMediaStreamSource(stream).connect(analyzer);
            dataArray = new Uint8Array(analyzer.frequencyBinCount);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 10);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.1));

        // 🍄 โครงข่ายไมโครไรซาแบบ Event-Driven (ลูกกวาด M&M 600 โหนด)
        const MAX_NODES = 600;
        const geometry = new THREE.BoxGeometry(0.18, 0.18, 0.18);
        const material = new THREE.MeshStandardMaterial({ roughness: 0.2, metalness: 0.1 });
        const voxelMesh = new THREE.InstancedMesh(geometry, material, MAX_NODES);

        const candyColors = [
            new THREE.Color(0x00f3ff), // Cyan
            new THREE.Color(0xff3399), // Pink
            new THREE.Color(0xffcc00), // Yellow
            new THREE.Color(0x00ff66)  // Green
        ];

        const dummy = new THREE.Object3D();
        const nodeStates = []; // เก็บสถานะ Event ของแต่ละโหนด

        for(let i=0; i<MAX_NODES; i++) {
            const x = (Math.random()-0.5)*7;
            const y = (Math.random()-0.5)*7;
            const z = (Math.random()-0.5)*7;
            
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            voxelMesh.setMatrixAt(i, dummy.matrix);
            voxelMesh.setColorAt(i, candyColors[Math.floor(Math.random() * candyColors.length)]);
            
            nodeStates.push({
                basePos: new THREE.Vector3(x, y, z),
                energy: 0.1, // พลังงานเริ่มต้นต่ำ (โหมดประหยัดพลังงาน / Sleep)
                freq: Math.random() * 2 + 1
            });
        }
        voxelMesh.instanceMatrix.needsUpdate = true;
        voxelMesh.instanceColor.needsUpdate = true;
        scene.add(voxelMesh);
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta(), t = clock.getElapsedTime();

            if(analyzer && dataArray && SYS.state === 'AWAKE') {
                analyzer.getByteFrequencyData(dataArray);
                let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                var audioEnergy = sum / dataArray.length / 255.0;
            } else {
                var audioEnergy = 0.0;
            }

            // ⚡ Event-Driven Spore Update: เรนเดอร์และปลุกพลังเฉพาะโหนดที่ได้รับ Event เท่านั้น
            for(let i=0; i<MAX_NODES; i++) {
                const node = nodeStates[i];
                
                // หากโครงข่ายตื่นรู้ (AWAKE) หรือมีเสียงพูด (Event) พลังงานจะถูกกระตุ้นให้เปล่งแสงและเด้ง
                const targetEnergy = (SYS.state === 'AWAKE') ? (0.3 + audioEnergy * 2.5) : 0.1;
                node.energy += (targetEnergy - node.energy) * dt * 5;

                // แสงเปล่งออกมาจากตัวมันเองตาม Event (ไม่อาศัยการคำนวณหนักหน่วงทั่วจอ)
                const scale = node.energy;
                dummy.position.copy(node.basePos);
                
                if(SYS.state === 'AWAKE') {
                    dummy.position.x += Math.sin(t * node.freq + i) * 0.3 * node.energy;
                    dummy.position.y += Math.cos(t * node.freq * 0.8 + i) * 0.3 * node.energy;
                }

                dummy.scale.set(scale, scale, scale);
                dummy.rotation.x = t * 0.5 + i;
                dummy.rotation.y = t * 0.3;
                
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(i, dummy.matrix);
            }
            voxelMesh.instanceMatrix.needsUpdate = true;
            voxelMesh.rotation.y = t * 0.05;

            composer.render();
        }
        animate();
    </script>
</body>
</html>
