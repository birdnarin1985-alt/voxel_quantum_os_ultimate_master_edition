<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voxel AI OS : Wholesale Telepresence</title>
    <style>
        :root {
            --bg-color: #010203;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(0, 243, 255, 0.02));
            --glass-border: 1px solid rgba(0, 243, 255, 0.15);
            --cyan-core: #00f3ff; --gold-core: #f39c12; --green-core: #00ff66; --red-core: #ff3366;
            --pure-white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-color); font-family: '-apple-system', 'Segoe UI', sans-serif; color: white; user-select: none; touch-action: none; }
        
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }

        /* IN-APP BROWSER ESCAPE (ป้ายสู่อิสรภาพ) */
        #in-app-escape { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; backdrop-filter: blur(20px); }
        .escape-box { background: rgba(243,156,18,0.1); border: 1px solid var(--gold-core); padding: 20px; border-radius: 20px; box-shadow: 0 0 40px rgba(243,156,18,0.3); }
        
        /* HUD & UI LAYER */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px; }
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; align-items: center; margin-top: 10px; }
        .glass-pill { background: rgba(0,0,0,0.6); border: var(--glass-border); padding: 6px 12px; border-radius: 20px; font-size: 0.65rem; backdrop-filter: blur(10px); color: var(--cyan-core); font-family: monospace; }
        
        .hud-panel { background: var(--glass-bg); border: var(--glass-border); border-radius: 24px; padding: 16px; backdrop-filter: blur(15px); pointer-events: auto; width: 100%; max-width: 420px; margin: 0 auto 10px auto; display: flex; flex-direction: column; gap: 10px; }
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn-glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 12px; border-radius: 16px; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.3s; text-align: center; }
        .btn-glass:active { transform: scale(0.95); }
        
        .main-btn { background: rgba(0, 243, 255, 0.1); border-color: var(--cyan-core); grid-column: span 2; }
        .hangup-btn { background: rgba(255, 51, 102, 0.15); border-color: var(--red-core); color: var(--red-core); grid-column: span 2; display: none; }
        
        /* CONTACT DRAWER (สหายธรรม) */
        #contact-drawer { position: absolute; bottom: -100%; left: 0; width: 100%; background: rgba(1,2,3,0.95); border-top: 1px solid var(--green-core); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)) 20px; z-index: 40; backdrop-filter: blur(20px); transition: bottom 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); pointer-events: auto; }
        #contact-drawer.open { bottom: 0; }
        .drawer-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin: 0 auto 15px auto; }
        .contact-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px 15px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;}
        .btn-call { background: rgba(0, 255, 102, 0.15); border: 1px solid var(--green-core); color: var(--green-core); padding: 6px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }

        /* VIDEO STREAM (Hidden, used for Audio Context) */
        video { display: none; }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
    <!-- โหลด PeerJS (ศาลาพักใจไร้เซิร์ฟเวอร์) -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <!-- ป้ายสู่อิสรภาพ (เตือนสหายทอม) -->
    <div id="in-app-escape">
        <div class="escape-box">
            <h2 style="color:var(--gold-core); margin-bottom:10px;">🪷 กรงขังมายา (In-App Browser)</h2>
            <p style="font-size:0.8rem; color:#ccc; line-height:1.5;">
                มิติควอนตัมไม่สามารถปรากฏใน Messenger ได้<br><br>
                <b>โปรดแตะปุ่มจุด 3 จุด (•••) มุมขวาบน<br>แล้วเลือก "เปิดใน Safari / เบราว์เซอร์"</b><br><br>
                เพื่อเข้าสู่การเชื่อมจิตอย่างสมบูรณ์
            </p>
        </div>
    </div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="glass-pill" id="my-spore-id">ศาลาพักใจ: กำลังเชื่อมต่อ...</div>
            <div class="glass-pill" id="eco-status" style="color:var(--gold-core); border-color:var(--gold-core);">ฌานสมาบัติ</div>
        </div>

        <div class="hud-panel" id="main-controls">
            <div class="btn-grid">
                <button class="btn-glass main-btn" onclick="toggleContactDrawer()">🍄 โครงข่ายไมโครไรซา (ดึงจิตเพื่อน)</button>
            </div>
        </div>

        <div class="hud-panel" id="call-controls" style="display:none; background:transparent; border:none;">
            <div class="btn-grid">
                <button class="btn-glass hangup-btn" id="btn-hangup" onclick="zenHangup()">🔴 วางสาย (คลายจิตสลาย Voxel)</button>
            </div>
        </div>
    </div>

    <div id="contact-drawer">
        <div class="drawer-handle" onclick="toggleContactDrawer()"></div>
        <div style="color:var(--green-core); font-size:0.85rem; font-weight:bold; margin-bottom:15px; text-align:center;">👥 บัญชีสหายธรรม</div>
        <div class="contact-list">
            <div class="contact-item">
                <span style="font-size: 0.8rem;">สหายทอม</span>
                <button class="btn-call" onclick="sendSporeInvite('สหายทอม')">ส่งสปอร์</button>
            </div>
            <div class="contact-item">
                <span style="font-size: 0.8rem;">สหายโปรแกรมเมอร์</span>
                <button class="btn-call" onclick="sendSporeInvite('สหายโปรแกรมเมอร์')">ส่งสปอร์</button>
            </div>
        </div>
        <button class="btn-glass" style="width:100%; margin-top:15px; border-color:var(--red-core); color:var(--red-core);" onclick="toggleContactDrawer()">พับเก็บ</button>
    </div>

    <video id="remoteVideo" autoplay playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const SYS = { state: 'ZEN', myId: null, currentCall: null, isReceiver: false };
        let audioCtx, analyzer, dataArray;
        let localStream;

        // --- 1. IN-APP BROWSER ESCAPE (อิทัปปัจจยตา) ---
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInApp = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Line") > -1);
        if (isInApp) {
            document.getElementById('in-app-escape').style.display = 'flex';
        }

        // --- 2. ZEN AUDIO (ตึ๊ด-ตึ๊ง) ---
        window.playZenChime = () => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const playNote = (freq, startTime, duration) => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                osc.start(startTime); osc.stop(startTime + duration);
            };
            const now = audioCtx.currentTime;
            playNote(880, now, 0.4); playNote(1320, now + 0.15, 0.8);
        };

        // --- 3. PEERJS (ศาลาพักใจไร้เซิร์ฟเวอร์) ---
        const peer = new Peer(); // เชื่อมต่อ Cloud ฟรีของ PeerJS
        
        peer.on('open', (id) => {
            SYS.myId = id;
            document.getElementById('my-spore-id').innerText = `สปอร์ ID: พร้อมดึงจิต`;
            checkUrlForSpore();
        });

        peer.on('call', async (call) => {
            // เมื่อมีเพื่อนโทรเข้ามา
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                call.answer(localStream);
                handleCall(call);
            } catch (err) { alert("โปรดอนุญาตไมโครโฟนเพื่อเชื่อมจิต"); }
        });

        // --- 4. ตรวจสอบการรับสปอร์ (เพื่อนกดลิงก์) ---
        async function checkUrlForSpore() {
            const urlParams = new URLSearchParams(window.location.search);
            const sporeId = urlParams.get('spore');
            if (sporeId && sporeId !== SYS.myId) {
                SYS.isReceiver = true;
                document.getElementById('eco-status').innerText = "กำลังประสานจิต...";
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    const call = peer.call(sporeId, localStream);
                    handleCall(call);
                } catch (err) { alert("โปรดอนุญาตไมโครโฟนเพื่อเชื่อมจิต"); }
            }
        }

        function handleCall(call) {
            SYS.currentCall = call;
            call.on('stream', (remoteStream) => {
                const videoEl = document.getElementById('remoteVideo');
                videoEl.srcObject = remoteStream;
                setupAudioReactive(remoteStream);
                
                // UX: เปลี่ยนเป็นโหมดโทร
                document.getElementById('main-controls').style.display = 'none';
                document.getElementById('call-controls').style.display = 'flex';
                document.getElementById('btn-hangup').style.display = 'block';
                document.getElementById('eco-status').innerText = "เชื่อมจิตสำเร็จ (Telepresence)";
                document.getElementById('eco-status').style.color = "var(--green-core)";
                
                triggerTelepresenceManifest(); // เนรมิต Voxel
            });
            call.on('close', () => window.zenHangup(true)); // โดนวางสาย
        }

        // --- 5. NATIVE SHARE (สปอร์ไมโครไรซา) ---
        window.toggleContactDrawer = () => {
            document.getElementById('contact-drawer').classList.toggle('open');
        };

        window.sendSporeInvite = async (friendName) => {
            window.playZenChime();
            window.toggleContactDrawer();
            
            // สร้างลิงก์จักรวาล (พ่วง ID ของช่างเบิร์ด)
            const inviteUrl = window.location.origin + window.location.pathname + '?spore=' + SYS.myId;
            const shareData = {
                title: 'Voxel AI OS : ดึงจิต',
                text: `[สปอร์ไมโครไรซา] เข้ามาคุยกันในมิติควอนตัมเถอะ ${friendName}!`,
                url: inviteUrl
            };
            
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    navigator.clipboard.writeText(shareData.text + " " + shareData.url);
                    alert("คัดลอกสปอร์แล้ว ส่งให้เพื่อนใน Messenger ได้เลย!");
                }
                document.getElementById('eco-status').innerText = "รอเพื่อนรับสปอร์...";
            } catch (err) { console.log("Share cancelled."); }
        };

        // --- 6. AUDIO-REACTIVE (แปลงเสียงเพื่อนเป็น Voxel) ---
        function setupAudioReactive(stream) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyzer = audioCtx.createAnalyser();
            analyzer.fftSize = 256;
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyzer);
            dataArray = new Uint8Array(analyzer.frequencyBinCount);
        }

        // --- 7. ZEN HANGUP (คลายจิตสลาย Voxel) ---
        window.zenHangup = (fromRemote = false) => {
            if (!fromRemote) window.playZenChime();
            if (SYS.currentCall) SYS.currentCall.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            
            SYS.state = 'DISSOLVE'; // เริ่มละลาย
            document.getElementById('eco-status').innerText = "คลายจิต...";
            
            setTimeout(() => {
                SYS.state = 'ZEN';
                document.getElementById('main-controls').style.display = 'flex';
                document.getElementById('call-controls').style.display = 'none';
                document.getElementById('eco-status').innerText = "ฌานสมาบัติ";
                document.getElementById('eco-status').style.color = "var(--gold-core)";
                voxelMesh.visible = false;
                
                // ถ้าสหายทอมเข้ามาแบบรับลิงก์ วางสายแล้วให้กลับหน้าโล่งๆ
                if(SYS.isReceiver) window.location.href = window.location.pathname; 
            }, 1500);
        };

        // --- 8. THREE.JS QUANTUM ENGINE (อหิงสาสถาปัตยกรรม) ---
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x010203, 0.05);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100); 
        camera.position.set(0, 0, 10); camera.lookAt(0, 0, 0); 

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.1));

        // ZEN MANDALA (Core)
        const coreShape = new THREE.Mesh(
            new THREE.TorusKnotGeometry(1.2, 0.3, 80, 16), 
            new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true, transparent: true, opacity: 0.5 })
        );
        scene.add(coreShape);

        // AUDIO-REACTIVE VOXEL (Telepresence)
        const MAX_VOXELS = 1000; // ประหยัดแบตเตอรี่ (Eco-Samadhi)
        const textMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 1.0 });
        const shaderUniforms = { uTime: { value: 0 }, uAudio: { value: 0.0 }, uDissolve: { value: 0.0 } };
        
        textMat.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = shaderUniforms.uTime; 
            shader.uniforms.uAudio = shaderUniforms.uAudio;
            shader.uniforms.uDissolve = shaderUniforms.uDissolve;
            shader.vertexShader = `uniform float uTime; uniform float uAudio; uniform float uDissolve; attribute vec3 aTargetPos; attribute vec3 aRandomPos;` + shader.vertexShader;
            shader.vertexShader = shader.vertexShader.replace(`#include <begin_vertex>`, `
                // หมุนตัวและขยายตามเสียง (Audio Reactivity)
                vec3 idlePos = aRandomPos + vec3(sin(uTime+aRandomPos.x), cos(uTime+aRandomPos.y), sin(uTime+aRandomPos.z)) * (0.2 + uAudio * 0.5);
                
                // จัดรูปทรงใบหน้าโฮโลแกรมคร่าวๆ (Sphere)
                vec3 facePos = normalize(aRandomPos) * (3.0 + uAudio * 1.5);
                
                vec3 formed = mix(idlePos, facePos, 1.0 - uDissolve);
                
                // Dissolve (สลายตัว)
                vec3 dissolvedPos = formed + (aRandomPos * 10.0 * uDissolve) + vec3(0.0, uDissolve * 5.0, 0.0);
                vec3 transformed = dissolvedPos;
            `);
            shader.fragmentShader = `uniform float uAudio;` + shader.fragmentShader;
            shader.fragmentShader = shader.fragmentShader.replace(`vec4 diffuseColor = vec4( diffuse, opacity );`, `
                vec3 dynamicColor = mix(diffuse, vec3(0.0, 1.0, 1.0), uAudio); // เรืองแสงสีฟ้าตอนพูด
                vec4 diffuseColor = vec4( dynamicColor, opacity );
            `);
        };

        const voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), textMat, MAX_VOXELS);
        const randomPosArray = new Float32Array(MAX_VOXELS * 3);
        for(let i=0; i<MAX_VOXELS; i++) {
            randomPosArray[i*3] = (Math.random()-0.5)*10; 
            randomPosArray[i*3+1] = (Math.random()-0.5)*10; 
            randomPosArray[i*3+2] = (Math.random()-0.5)*10;
        }
        voxelMesh.geometry.setAttribute('aRandomPos', new THREE.InstancedBufferAttribute(randomPosArray, 3));
        voxelMesh.visible = false; scene.add(voxelMesh); scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        function triggerTelepresenceManifest() {
            SYS.state = 'MANIFEST';
            voxelMesh.visible = true; coreShape.visible = false;
            shaderUniforms.uDissolve.value = 0.0;
        }

        const clock = new THREE.Clock();
        function render() {
            requestAnimationFrame(render);
            const dt = clock.getDelta(); const t = clock.getElapsedTime();
            
            // อัปเดตคลื่นเสียง
            let audioVolume = 0;
            if (analyzer && dataArray) {
                analyzer.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                audioVolume = (sum / dataArray.length) / 255.0; // 0.0 to 1.0
                shaderUniforms.uAudio.value += (audioVolume - shaderUniforms.uAudio.value) * dt * 10.0; // สมูทคลื่นเสียง
            }
            
            if(SYS.state === 'ZEN') { 
                coreShape.visible = true; 
                coreShape.rotation.x += dt * 0.2; coreShape.rotation.y += dt * 0.4; 
            } 
            else if (SYS.state === 'MANIFEST' || SYS.state === 'DISSOLVE') {
                shaderUniforms.uTime.value = t;
                voxelMesh.rotation.y = Math.sin(t * 0.2) * 0.2;
                
                if (SYS.state === 'DISSOLVE') {
                    shaderUniforms.uDissolve.value += dt * 1.5; // สลายตัว 
                }
            }
            composer.render();
        }
        render();
    </script>
</body>
</html>
