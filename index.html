<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voxel Quantum OS : Cosmic Graph Edition</title>
    <style>
        :root { --bg: #010203; --cyan: #00f3ff; --gold: #f39c12; --green: #00ff66; --red: #ff3366; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--white); touch-action: none; }
        #webgl-canvas { position: absolute; inset: 0; z-index: 1; }
        .glass-box { background: rgba(0, 10, 15, 0.7); border: 1px solid rgba(0, 243, 255, 0.3); backdrop-filter: blur(25px); border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 0 40px rgba(0, 243, 255, 0.15); }
        .btn-quantum { background: rgba(0, 243, 255, 0.15); border: 1px solid var(--cyan); color: var(--white); padding: 14px; border-radius: 14px; font-size: 0.9rem; font-weight: bold; cursor: pointer; width: 100%; transition: transform 0.2s; }
        .btn-quantum:active { transform: scale(0.95); }
        /* ซ่อนวิดีโอแต่เปิดเสียงเฉพาะ remoteAudio เพื่อไม่ให้เกิดเสียงสะท้อน */
        audio, video { display: none; }
    </style>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.150.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/" } }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <!-- ใช้ tag audio สำหรับเสียงปลายทางโดยเฉพาะ เพื่อป้องกันเสียงสะท้อนจากไมค์ตัวเอง -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ☸️ โครงสร้างข้อมูลกราฟพอยเตอร์ (Cosmic Graph Pointer UI)
        const cosmicGraph = {
            tag: 'div', id: 'ui-layer', style: 'position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:20px;',
            children: [
                {
                    tag: 'div', style: 'display:flex; justify-content:space-between; pointer-events:auto;',
                    children: [
                        { tag: 'div', id: 'my-spore-id', style: 'background:rgba(0,0,0,0.6); border:1px solid var(--cyan); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--cyan); font-family:monospace;', text: 'ศาลาพักใจ: เตรียมพร้อม...' },
                        { tag: 'div', id: 'eco-status', style: 'background:rgba(0,0,0,0.6); border:1px solid var(--gold); padding:6px 12px; border-radius:20px; font-size:0.65rem; color:var(--gold); font-family:monospace;', text: 'ฌานสมาบัติ' }
                    ]
                },
                {
                    tag: 'div', id: 'hud-main', style: 'pointer-events:auto; max-width:400px; width:100%; margin:0 auto;',
                    children: [
                        { tag: 'button', className: 'btn-quantum', style: 'border-color:var(--green); color:var(--green); background:rgba(0,255,102,0.1);', text: '🍄 ส่งสปอร์ไมครอไรซา (แผ่เมตตา)', onClick: () => window.sendSpore() }
                    ]
                },
                {
                    tag: 'div', id: 'hud-call', style: 'pointer-events:auto; max-width:400px; width:100%; margin:0 auto; display:none;',
                    children: [
                        { tag: 'button', className: 'btn-quantum', style: 'border-color:var(--red); color:var(--red); background:rgba(255,51,102,0.1);', text: '🔴 วางสาย (คลายจิตสลาย Voxel)', onClick: () => window.zenHangup() }
                    ]
                }
            ]
        };

        function manifestGraph(node, parent) {
            const el = document.createElement(node.tag || 'div');
            if(node.id) el.id = node.id;
            if(node.className) el.className = node.className;
            if(node.style) el.style.cssText = node.style;
            if(node.text) el.innerText = node.text;
            if(node.html) el.innerHTML = node.html;
            if(node.onClick) el.onclick = node.onClick;
            if(node.children) node.children.forEach(c => manifestGraph(c, el));
            parent.appendChild(el);
            return el;
        }
        manifestGraph(cosmicGraph, document.body);

        if (/FBAN|FBAV|Line/i.test(navigator.userAgent || "")) {
            manifestGraph({
                tag: 'div', style: 'position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:9999; display:flex; justify-content:center; align-items:center; padding:30px;',
                children: [{ tag: 'div', className: 'glass-box', html: '<h2 style="color:var(--gold); margin-bottom:10px;">🪷 กรงขังมายา</h2><p style="font-size:0.8rem; color:#ccc;">โปรดเปิดใน Safari หรือ Chrome</p>' }]
            }, document.body);
        }

        const SYS = { state: 'ZEN', myId: null, currentCall: null };
        let audioCtx, analyzer, dataArray, localStream;

        window.playZenChime = () => {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [880, 1320].forEach((f, i) => {
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination); osc.frequency.value = f;
                g.gain.setValueAtTime(0, now + i*0.15); g.gain.linearRampToValueAtTime(0.2, now + i*0.15 + 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, now + i*0.15 + 0.6);
                osc.start(now + i*0.15); osc.stop(now + i*0.15 + 0.6);
            });
        };

        const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } });
        
        peer.on('open', async (id) => {
            SYS.myId = id;
            document.getElementById('my-spore-id').innerText = `สปอร์ ID: พร้อม`;
            const urlParams = new URLSearchParams(window.location.search);
            const targetSpore = urlParams.get('spore');
            
            if(targetSpore && targetSpore !== id) {
                playZenChime();
                document.getElementById('eco-status').innerText = "กำลังประสานจิตอัตโนมัติ...";
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    const call = peer.call(targetSpore, localStream);
                    bindCallEvents(call);
                } catch(e) { alert("โปรดอนุญาตไมโครโฟนเพื่อเชื่อมจิต"); }
            }
        });

        peer.on('call', async (call) => {
            playZenChime();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                call.answer(localStream);
                bindCallEvents(call);
            } catch(e) { alert("โปรดอนุญาตไมโครโฟน"); }
        });

        window.sendSpore = async () => {
            playZenChime();
            const url = `${window.location.origin}${window.location.pathname}?spore=${SYS.myId}`;
            if(navigator.share) { try { await navigator.share({ title: 'Voxel Quantum OS', text: 'เชื่อมจิตไมโครไรซากันเถอะ!', url }); } catch(e){} }
            else { navigator.clipboard.writeText(url); alert("คัดลอกสปอร์แล้ว ส่งให้เพื่อนได้เลย!"); }
            document.getElementById('eco-status').innerText = "รอเพื่อนรับสปอร์...";
        };

        function bindCallEvents(call) {
            SYS.currentCall = call;
            call.on('stream', (remoteStream) => {
                // ผูกเสียงเฉพาะปลายทางผ่าน tag audio เพื่อตัดเสียงสะท้อนของตนเอง
                const ra = document.getElementById('remoteAudio');
                ra.srcObject = remoteStream; 
                ra.play().catch(e => console.log("Audio autoplay error:", e));
                
                setupAudioReactive(remoteStream);
                
                // สลับ UI และปลุกอนุภาค Voxel ทันที
                document.getElementById('hud-main').style.display = 'none';
                document.getElementById('hud-call').style.display = 'block';
                document.getElementById('eco-status').innerText = "เชื่อมจิตสำเร็จ (Telepresence)";
                document.getElementById('eco-status').style.color = "var(--green)";
                
                SYS.state = 'MANIFEST'; 
                voxelMesh.visible = true; 
                coreShape.visible = false;
            });
            call.on('close', () => window.zenHangup(true));
        }

        window.zenHangup = (remote = false) => {
            if(!remote) playZenChime();
            if(SYS.currentCall) SYS.currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            SYS.state = 'ZEN';
            document.getElementById('hud-main').style.display = 'block';
            document.getElementById('hud-call').style.display = 'none';
            document.getElementById('eco-status').innerText = "ฌานสมาบัติ";
            document.getElementById('eco-status').style.color = "var(--gold)";
            voxelMesh.visible = false; coreShape.visible = true;
            window.location.href = window.location.pathname;
        };

        function setupAudioReactive(stream) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            analyzer = audioCtx.createAnalyser(); analyzer.fftSize = 256;
            audioCtx.createMediaStreamSource(stream).connect(analyzer);
            dataArray = new Uint8Array(analyzer.frequencyBinCount);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 10);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.1));

        const coreShape = new THREE.Mesh(new THREE.TorusKnotGeometry(1.2, 0.3, 64, 16), new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true, transparent: true, opacity: 0.5 }));
        scene.add(coreShape);

        const MAX_V = 800;
        const vMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 1.0 });
        const uniforms = { uTime: { value: 0 }, uAudio: { value: 0 } };
        vMat.onBeforeCompile = (sh) => {
            sh.uniforms.uTime = uniforms.uTime; sh.uniforms.uAudio = uniforms.uAudio;
            sh.vertexShader = `uniform float uTime; uniform float uAudio; attribute vec3 aRnd;` + sh.vertexShader;
            sh.vertexShader = sh.vertexShader.replace(`#include <begin_vertex>`, `
                vec3 pos = aRnd + vec3(sin(uTime+aRnd.x), cos(uTime+aRnd.y), sin(uTime+aRnd.z)) * (0.2 + uAudio * 0.6);
                vec3 transformed = mix(pos, normalize(aRnd) * 3.5, 0.5);
            `);
            sh.fragmentShader = `uniform float uAudio;` + sh.fragmentShader;
            sh.fragmentShader = sh.fragmentShader.replace(`vec4 diffuseColor = vec4( diffuse, opacity );`, `
                vec4 diffuseColor = vec4( mix(diffuse, vec3(0,1,1), uAudio), opacity );
            `);
        };

        const voxelMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), vMat, MAX_V);
        const rndArr = new Float32Array(MAX_V * 3);
        for(let i=0; i<MAX_V*3; i++) rndArr[i] = (Math.random()-0.5)*8;
        voxelMesh.geometry.setAttribute('aRnd', new THREE.InstancedBufferAttribute(rndArr, 3));
        voxelMesh.visible = false; scene.add(voxelMesh); scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta(), t = clock.getElapsedTime();
            if(analyzer && dataArray) {
                analyzer.getByteFrequencyData(dataArray);
                let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                uniforms.uAudio.value += ((sum / dataArray.length / 255.0) - uniforms.uAudio.value) * dt * 10;
            }
            if(SYS.state === 'ZEN') { coreShape.rotation.x += dt*0.2; coreShape.rotation.y += dt*0.4; }
            else { uniforms.uTime.value = t; voxelMesh.rotation.y = Math.sin(t*0.2)*0.3; }
            composer.render();
        }
        animate();
    </script>
</body>
</html>
